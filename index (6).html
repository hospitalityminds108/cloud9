<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay Above the Ordinary — Cloud 9 Hills Resort</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   CLOUD 9 — ROOMS / STAY SECTION
   Lazy auto-scroll · scroll-linked · native swipe on mobile
   ============================================================ */

.c9-rooms{
  --forest:#1C4128;
  --cream:#F9F7F2;
  --sage:#8A9A86;
  --sand:#D8CBB5;
  --gold:#C29B38;
  --charcoal:#1E1E1E;
  --soft:#EAEAEA;

  --display:'Playfair Display',Georgia,serif;
  --body:'Montserrat',Helvetica,Arial,sans-serif;

  --r-lg:28px;
  --r-md:18px;
  --r-sm:10px;
  --ease:cubic-bezier(.22,.61,.36,1);

  /* Card sizing — updated per breakpoint */
  --card-w:380px;
  --card-gap:24px;
  --track-duration:80s;      /* LAZY: much slower than before */

  position:relative;
  isolation:isolate;
  padding:clamp(80px,10vw,140px) 0 clamp(80px,10vw,140px);
  background:var(--cream);
  color:var(--charcoal);
  font-family:var(--body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.c9-rooms *,
.c9-rooms *::before,
.c9-rooms *::after{box-sizing:border-box;}
.c9-rooms img{display:block;max-width:100%;height:auto;}
.c9-rooms a{color:inherit;text-decoration:none;}

/* ---------- Background mountain contours ---------- */
.c9-rooms-bg{
  position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.42;
}
.c9-rooms-bg svg{position:absolute;left:0;width:100%;height:auto;}
.c9-rooms-bg svg:nth-child(1){ top:6%;  animation:c9ContourDrift 70s ease-in-out infinite; }
.c9-rooms-bg svg:nth-child(2){ top:34%; animation:c9ContourDrift 90s ease-in-out infinite reverse; opacity:.7; }
.c9-rooms-bg svg:nth-child(3){ top:64%; animation:c9ContourDrift 110s ease-in-out infinite; opacity:.55; }
@keyframes c9ContourDrift{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(-40px,8px,0);}
}

/* ---------- Container ---------- */
.c9-rooms-inner{
  position:relative;z-index:2;
  max-width:1440px;margin:0 auto;
  padding:0 clamp(20px,5vw,80px);
}

/* ============================================================
   HEADER
   ============================================================ */
.c9-rooms-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:40px;
  align-items:end;
  margin-bottom:clamp(40px,5vw,72px);
}
.c9-rooms-head-left{max-width:660px;}

.c9-rooms-eyebrow{
  display:flex;align-items:center;gap:14px;
  margin:0 0 22px;
  font-size:.7rem;font-weight:600;
  letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);
}
.c9-rooms-eyebrow::before{
  content:'';width:0;height:1px;flex:0 0 auto;
  background:linear-gradient(90deg,var(--gold),rgba(194,155,56,0));
  transition:width 1s var(--ease) .25s;
}
.c9-rooms.is-inview .c9-rooms-eyebrow::before{width:50px;}

.c9-rooms-title{
  margin:0;
  font-family:var(--display);
  font-weight:500;
  font-size:clamp(2.2rem,5.2vw,4.2rem);
  line-height:1.02;
  letter-spacing:.005em;
  text-transform:uppercase;
  color:var(--forest);
}
.c9-rooms-title span{
  display:block;overflow:hidden;
  padding-bottom:.08em;margin-bottom:-.08em;
}
.c9-rooms-title i{
  display:block;font-style:normal;
  transform:translateY(112%);
  transition:transform 1.05s var(--ease);
}
.c9-rooms.is-inview .c9-rooms-title i{transform:translateY(0);}
.c9-rooms.is-inview .c9-rooms-title span:nth-child(2) i{transition-delay:.1s;}

.c9-rooms-sub{
  margin:24px 0 0;
  max-width:52ch;
  font-size:clamp(.94rem,1.1vw,1.04rem);
  line-height:1.75;
  font-weight:300;
  color:rgba(30,30,30,.68);
}

/* ---------- Header right ---------- */
.c9-rooms-meta{
  display:flex;align-items:center;
  gap:clamp(20px,3vw,40px);
}

.c9-rooms-badge{
  position:relative;
  width:clamp(110px,11vw,140px);
  aspect-ratio:1;
  display:grid;place-items:center;
  color:var(--forest);flex:0 0 auto;
  transition:transform .5s var(--ease);
}
.c9-rooms-badge:hover{transform:scale(1.05);}
.c9-rooms-badge svg{
  position:absolute;inset:0;
  width:100%;height:100%;
  animation:c9BadgeSpin 26s linear infinite;
}
.c9-rooms-badge:hover svg{animation-duration:12s;}
.c9-rooms-badge text{
  font-family:var(--body);
  font-size:11px;font-weight:600;
  letter-spacing:.24em;fill:var(--forest);
}
.c9-rooms-badge-core{
  position:relative;z-index:1;
  display:grid;place-items:center;
  width:54%;aspect-ratio:1;border-radius:50%;
  background:var(--forest);color:var(--cream);
  font-size:1.1rem;
  transition:background .4s var(--ease), transform .4s var(--ease);
}
.c9-rooms-badge:hover .c9-rooms-badge-core{
  background:var(--gold);transform:translateY(3px);
}
@keyframes c9BadgeSpin{ to{ transform:rotate(360deg); } }

.c9-rooms-indicator{text-align:right;line-height:1.2;}
.c9-rooms-indicator-num{
  display:block;
  font-family:var(--display);
  font-size:clamp(1.6rem,2.4vw,2.2rem);
  font-weight:500;color:var(--forest);
  letter-spacing:.02em;
}
.c9-rooms-indicator-num b{color:var(--gold);}
.c9-rooms-indicator-label{
  display:block;margin-top:6px;
  font-size:.62rem;font-weight:600;
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--sage);
}

@media (max-width:860px){
  .c9-rooms-head{grid-template-columns:1fr;gap:32px;}
  .c9-rooms-meta{justify-content:flex-start;}
  .c9-rooms-indicator{text-align:left;}
}

/* ============================================================
   VIEWPORT + TRACK
   ============================================================ */
.c9-rooms-viewport{
  position:relative;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,
    transparent 0%, #000 6%, #000 94%, transparent 100%);
          mask-image:linear-gradient(to right,
    transparent 0%, #000 6%, #000 94%, transparent 100%);
  touch-action:pan-y;
  cursor:grab;
  padding:20px 0 30px;
}
.c9-rooms-viewport.is-dragging{cursor:grabbing;}

.c9-rooms-track{
  display:flex;
  gap:var(--card-gap);
  width:max-content;
  transform:translate3d(0,0,0);
  will-change:transform;
  backface-visibility:hidden;
}

/* ============================================================
   ROOM CARD
   ============================================================ */
.c9-room{
  position:relative;
  flex:0 0 var(--card-w);
  width:var(--card-w);
  background:#FFFFFF;
  border:1px solid rgba(28,65,40,.08);
  border-radius:var(--r-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  transform-origin:center center;
  transition:transform .55s var(--ease),
             box-shadow .55s var(--ease),
             border-color .55s var(--ease);
  will-change:transform;
  box-shadow:0 14px 40px -28px rgba(28,65,40,.35);
}
.c9-room:hover{
  transform:translateY(-8px);
  border-color:rgba(194,155,56,.4);
  box-shadow:0 34px 60px -28px rgba(28,65,40,.32);
}
.c9-room.is-featured{
  border-color:rgba(194,155,56,.35);
  box-shadow:0 24px 56px -30px rgba(28,65,40,.4);
}

.c9-room-media{
  position:relative;
  aspect-ratio:5/4;
  overflow:hidden;
  background:var(--forest);
}
.c9-room-media img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  transform:translate3d(0,0,0) scale(1.02);
  transition:transform .9s var(--ease);
  will-change:transform;
}
.c9-room:hover .c9-room-media img{
  transform:translate3d(0,-6px,0) scale(1.08);
}
.c9-room-media::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(28,65,40,0) 45%, rgba(28,65,40,.55) 100%);
  opacity:.5;
  transition:opacity .55s var(--ease);
  pointer-events:none;
}
.c9-room:hover .c9-room-media::after{opacity:.75;}

.c9-room-num{
  position:absolute;top:18px;left:18px;z-index:3;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;height:32px;padding:0 12px;
  border-radius:999px;
  background:rgba(249,247,242,.92);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  color:var(--forest);
  font-family:var(--body);
  font-size:.72rem;font-weight:700;letter-spacing:.14em;
  transition:transform .5s var(--ease), background .4s var(--ease), color .4s var(--ease);
}
.c9-room:hover .c9-room-num{
  transform:translateY(-4px);
  background:var(--forest);color:var(--cream);
}

.c9-room-tag{
  position:absolute;top:18px;right:18px;z-index:3;
  padding:7px 12px;border-radius:999px;
  background:rgba(28,65,40,.82);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  color:var(--sand);
  font-size:.6rem;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
}

.c9-room-body{
  position:relative;
  padding:24px 26px 26px;
  display:flex;flex-direction:column;
  gap:14px;
  background:#FFFFFF;
  flex:1 1 auto;
}

.c9-room-title{
  margin:0;
  font-family:var(--display);
  font-weight:500;
  font-size:1.32rem;
  line-height:1.15;
  letter-spacing:.01em;
  color:var(--forest);
  transition:transform .5s var(--ease);
}
.c9-room:hover .c9-room-title{transform:translateY(-3px);}

.c9-room-desc{
  margin:0;
  font-size:.86rem;
  line-height:1.7;
  font-weight:300;
  color:rgba(30,30,30,.66);
}

.c9-room-meta{
  display:flex;flex-wrap:wrap;
  gap:6px 16px;
  padding-top:14px;
  margin-top:auto;
  border-top:1px solid rgba(28,65,40,.1);
}
.c9-room-meta span{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.62rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--sage);
}
.c9-room-meta svg{
  width:13px;height:13px;flex:0 0 auto;
  stroke:var(--gold);
}

.c9-room-accent{
  display:block;
  width:0;height:2px;
  margin-top:14px;
  background:linear-gradient(90deg,var(--gold),rgba(194,155,56,.3));
  border-radius:999px;
  transition:width .55s var(--ease);
}
.c9-room:hover .c9-room-accent{width:50px;}

.c9-room-cta{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:6px;
  font-size:.68rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--forest);
  transition:color .4s var(--ease), gap .4s var(--ease);
}
.c9-room:hover .c9-room-cta{color:var(--gold);gap:14px;}
.c9-room-cta .c9-room-arrow{
  transition:transform .45s var(--ease);
}
.c9-room:hover .c9-room-cta .c9-room-arrow{transform:translateX(5px);}

.c9-room.is-featured .c9-room-num{background:var(--sand);}

/* ============================================================
   BOTTOM CTA
   ============================================================ */
.c9-rooms-footer{
  max-width:1440px;
  margin:clamp(50px,6vw,80px) auto 0;
  padding:clamp(34px,4vw,52px) clamp(24px,4vw,60px);
  border:1px solid rgba(28,65,40,.1);
  border-radius:var(--r-lg);
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(216,203,181,.35), rgba(216,203,181,0) 55%),
    linear-gradient(135deg, rgba(28,65,40,.04), rgba(28,65,40,0) 60%),
    #FFFFFF;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:32px;align-items:center;
}
.c9-rooms-footer-text h3{
  margin:0 0 8px;
  font-family:var(--display);
  font-weight:500;
  font-size:clamp(1.3rem,2.4vw,1.85rem);
  line-height:1.15;
  color:var(--forest);
}
.c9-rooms-footer-text p{
  margin:0;
  font-size:clamp(.86rem,1vw,.94rem);
  line-height:1.7;font-weight:300;
  color:rgba(30,30,30,.66);
  max-width:52ch;
}
.c9-rooms-footer-actions{display:flex;gap:14px;flex-wrap:wrap;}

.c9-rooms-btn{
  position:relative;
  display:inline-flex;align-items:center;gap:12px;
  padding:15px 28px;border-radius:999px;
  font-family:var(--body);
  font-size:.7rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;
  transition:background .4s var(--ease), color .4s var(--ease),
             border-color .4s var(--ease), transform .35s var(--ease),
             box-shadow .4s var(--ease);
}
.c9-rooms-btn svg{width:15px;height:15px;transition:transform .4s var(--ease);}
.c9-rooms-btn:hover svg{transform:translateX(4px);}
.c9-rooms-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

.c9-rooms-btn--solid{
  background:var(--forest);color:var(--cream);
  border:1px solid var(--forest);
}
.c9-rooms-btn--solid:hover{
  background:#143019;transform:translateY(-2px);
  box-shadow:0 18px 34px -18px rgba(28,65,40,.7);
}
.c9-rooms-btn--ghost{
  background:transparent;color:var(--forest);
  border:1px solid rgba(28,65,40,.35);
}
.c9-rooms-btn--ghost:hover{
  background:var(--forest);color:var(--cream);
  border-color:var(--forest);transform:translateY(-2px);
}
@media (max-width:860px){
  .c9-rooms-footer{grid-template-columns:1fr;gap:26px;}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1100px){
  .c9-rooms{ --card-w:340px; --card-gap:22px; --track-duration:70s; }
}
@media (max-width:860px){
  .c9-rooms{ --card-w:300px; --card-gap:20px; --track-duration:65s; }
  .c9-room-body{padding:20px 22px 22px;}
  .c9-room-title{font-size:1.2rem;}
}

/* ---------- MOBILE — native scroll, no marquee ---------- */
@media (max-width:768px){
  .c9-rooms{ --card-w:78vw; --card-gap:16px; }

  .c9-rooms-viewport{
    /* Switch to native horizontal scroll */
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:auto;
    touch-action:pan-x pan-y;

    /* Remove edge mask so cards aren't clipped */
    -webkit-mask-image:none;
            mask-image:none;

    /* Breathing room at the edges */
    padding:20px 20px 30px;
    margin:0 -20px; /* pull to full-bleed inside .c9-rooms-inner padding */
  }
  .c9-rooms-viewport::-webkit-scrollbar{display:none;}

  /* JS no longer transforms the track on mobile */
  .c9-rooms-track{
    transform:none !important;
    transition:none !important;
    will-change:auto;
    gap:var(--card-gap);
  }

  .c9-room{
    scroll-snap-align:start;
    scroll-margin-left:20px;
    /* Remove the featured emphasis on mobile (no center detection) */
    box-shadow:0 12px 32px -22px rgba(28,65,40,.3);
  }
  .c9-room.is-featured{
    border-color:rgba(28,65,40,.08);
    box-shadow:0 12px 32px -22px rgba(28,65,40,.3);
  }
  /* Hide the duplicated half — only one set scrolls on mobile */
  .c9-room[data-dup="1"]{ display:none; }

  /* Bigger tap target */
  .c9-room-cta{padding:6px 0;}
}

@media (max-width:640px){
  .c9-rooms-inner{padding:0 20px;}
  .c9-rooms-footer-actions{width:100%;}
  .c9-rooms-btn{flex:1 1 auto;justify-content:center;}
}
@media (max-width:430px){
  .c9-rooms{ --card-w:82vw; --card-gap:14px; }
  .c9-room-num{min-width:40px;height:28px;font-size:.66rem;}
  .c9-room-tag{padding:6px 10px;font-size:.55rem;}
  .c9-room-meta span{font-size:.58rem;}
}
@media (max-width:360px){
  .c9-rooms{ --card-w:84vw; }
  .c9-rooms-footer{padding:24px 20px;}
}

/* ============================================================
   SCROLL REVEAL
   ============================================================ */
.c9-rooms [data-reveal]{
  opacity:0;transform:translateY(26px);
  transition:opacity .9s var(--ease), transform .9s var(--ease);
  transition-delay:var(--d,0ms);
}
.c9-rooms.is-inview [data-reveal]{opacity:1;transform:translateY(0);}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  .c9-rooms *,
  .c9-rooms *::before,
  .c9-rooms *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    transition-delay:0ms!important;
  }
  .c9-rooms-bg svg{animation:none!important;}
  .c9-rooms-badge svg{animation:none!important;}
  .c9-rooms-title i{transform:none!important;}
  .c9-rooms [data-reveal]{opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>

<section class="c9-rooms" id="rooms" aria-labelledby="c9RoomsTitle">

  <div class="c9-rooms-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none">
      <path d="M0 160 Q 240 90 480 130 T 960 120 T 1440 150" stroke="#8A9A86" stroke-width="1" opacity=".55"/>
    </svg>
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none">
      <path d="M0 180 Q 300 110 620 150 T 1180 140 T 1440 170" stroke="#B89B72" stroke-width="1" opacity=".45"/>
    </svg>
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none">
      <path d="M0 200 Q 260 140 540 175 T 1080 165 T 1440 195" stroke="#8A9A86" stroke-width="1" opacity=".4"/>
    </svg>
  </div>

  <div class="c9-rooms-inner">

    <header class="c9-rooms-head">
      <div class="c9-rooms-head-left">
        <p class="c9-rooms-eyebrow" data-reveal style="--d:60ms">Your Stay at Cloud&nbsp;9</p>
        <h2 class="c9-rooms-title" id="c9RoomsTitle">
          <span><i>Stay Above</i></span>
          <span><i>the Ordinary</i></span>
        </h2>
        <p class="c9-rooms-sub" data-reveal style="--d:240ms">
          Wake up to misty mornings, mountain views and the comfort of a
          stay designed around the hills.
        </p>
      </div>

      <div class="c9-rooms-meta" data-reveal style="--d:320ms">
        <div class="c9-rooms-badge" aria-hidden="true">
          <svg viewBox="0 0 140 140">
            <defs>
              <path id="c9RoomBadgePath"
                    d="M 70,70 m -54,0 a 54,54 0 1,1 108,0 a 54,54 0 1,1 -108,0"
                    fill="none"/>
            </defs>
            <text>
              <textPath href="#c9RoomBadgePath" startOffset="0">
                EXPLORE OUR STAYS • EXPLORE OUR STAYS •
              </textPath>
            </text>
          </svg>
          <span class="c9-rooms-badge-core">&darr;</span>
        </div>

        <div class="c9-rooms-indicator">
          <span class="c9-rooms-indicator-num">
            <b data-active-num>01</b> &mdash; <span data-total-num>10</span>
          </span>
          <span class="c9-rooms-indicator-label">Rooms</span>
        </div>
      </div>
    </header>

    <div class="c9-rooms-viewport" data-viewport aria-label="Room gallery — swipe or drag to browse">
      <div class="c9-rooms-track" data-track></div>
    </div>

    <div class="c9-rooms-footer" data-reveal style="--d:420ms">
      <div class="c9-rooms-footer-text">
        <h3>Find Your Perfect Stay</h3>
        <p>Choose your space, slow down and experience Lonavala differently.</p>
      </div>
      <div class="c9-rooms-footer-actions">
        <a href="stay.html" class="c9-rooms-btn c9-rooms-btn--ghost">
          <span>View All Rooms</span>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 8h11M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="https://www.swiftbook.io/inst/#home?propertyId=2647"
           class="c9-rooms-btn c9-rooms-btn--solid"
           target="_blank" rel="noopener">
          <span>Book Your Stay</span>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 8h11M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

  </div>
</section>


<script>
/* ============================================================
   ROOM DATA
   ============================================================ */
(function () {
  'use strict';

  var ROOMS = [
    { number:'01', name:'3 Bedroom Luxury Villa',
      description:'A private mountain-view villa built for families and groups.',

      link:'aranya-honeymoon-suite.html' }
  ];

  var ICONS = {
    guests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M16.5 14.5c2.4.4 4 2.3 4.5 5.5"/></svg>',
    bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M5 10V7h6v3"/></svg>',
    view:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18l5-6 4 4 5-7 6 9"/></svg>'
  };

  /* ============================================================
     DOM refs
     ============================================================ */
  var section   = document.querySelector('.c9-rooms');
  var track     = document.querySelector('[data-track]');
  var viewport  = document.querySelector('[data-viewport]');
  var activeNum = document.querySelector('[data-active-num]');
  var totalEl   = document.querySelector('[data-total-num]');
  if (!section || !track || !viewport) return;

  if (totalEl) totalEl.textContent = String(ROOMS.length).padStart(2, '0');

  function cardMarkup(r, isDup) {
    return '' +
      '<article class="c9-room"' + (isDup ? ' data-dup="1" aria-hidden="true"' : '') + '>' +
        '<a class="c9-room-link" href="' + r.link + '" aria-label="' + r.name + '">' +
          '<div class="c9-room-media">' +
            '<span class="c9-room-num">' + r.number + '</span>' +
            '<span class="c9-room-tag">' + r.tag + '</span>' +
            '<img src="' + r.image + '" alt="' + (isDup ? '' : r.name + ' at Cloud 9 Hills Resort') + '" ' +
                 'loading="lazy" decoding="async" width="760" height="608">' +
          '</div>' +
          '<div class="c9-room-body">' +
            '<h3 class="c9-room-title">' + r.name + '</h3>' +
            '<p class="c9-room-desc">' + r.description + '</p>' +
            '<div class="c9-room-meta">' +
              '<span>' + ICONS.guests + r.guests + '</span>' +
              '<span>' + ICONS.bed + r.bed + '</span>' +
              '<span>' + ICONS.view + r.view + '</span>' +
            '</div>' +
            '<span class="c9-room-accent" aria-hidden="true"></span>' +
            '<span class="c9-room-cta">' +
              '<span>Explore Room</span>' +
              '<span class="c9-room-arrow" aria-hidden="true">&rarr;</span>' +
            '</span>' +
          '</div>' +
        '</a>' +
      '</article>';
  }

  /* ============================================================
     MODE
     ============================================================ */
  var mobileMQ = window.matchMedia('(max-width: 768px)');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = mobileMQ.matches;

  var cards = [];
  var halfWidth = 0;
  var speed = 0;
  var baseTx = 0;           // auto-scroll offset (desktop)
  var paused = false;       // hover / focus pause
  var dragging = false;     // drag pause
  var dragStartX = 0;
  var dragStartTx = 0;
  var resumeTimer = null;
  var rafId = null;
  var lastFrame = 0;
  var featuredIdx = -1;
  var scrollShiftMax = 260; // px — additional movement from vertical scroll

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    var html = ROOMS.map(function (r) { return cardMarkup(r, false); }).join('');
    // Duplicate only on desktop for the infinite marquee
    if (!isMobile) {
      html += ROOMS.map(function (r) { return cardMarkup(r, true); }).join('');
    }
    track.innerHTML = html;
    cards = Array.prototype.slice.call(track.querySelectorAll('.c9-room'));
  }

  /* ============================================================
     MEASURE (desktop only)
     ============================================================ */
  function measure() {
    if (isMobile) return;
    var totalWidth = track.scrollWidth;
    halfWidth = totalWidth / 2;

    var durationSec = parseFloat(
      getComputedStyle(section).getPropertyValue('--track-duration').trim()
    ) || 80;

    speed = halfWidth / durationSec;  // px per second
  }

  /* ============================================================
     SCROLL-LINKED SHIFT
     Adds a small horizontal offset based on where the section is
     relative to the viewport. Feels cinematic — no fighting with
     the auto-scroll.
     ============================================================ */
  function getScrollShift() {
    var rect = section.getBoundingClientRect();
    var vh = window.innerHeight;
    var totalRange = vh + rect.height;
    var scrolled = vh - rect.top;
    var progress = Math.max(0, Math.min(1, scrolled / totalRange));
    // Range: -0.5 → +0.5 mapped to ±scrollShiftMax
    return (progress - 0.5) * scrollShiftMax;
  }

  /* ============================================================
     APPLY TRANSFORM (desktop only)
     ============================================================ */
  function applyTransform() {
    var finalTx = baseTx - getScrollShift();

    // Wrap into (-halfWidth, 0]
    if (halfWidth > 0) {
      while (finalTx <= -halfWidth) finalTx += halfWidth;
      while (finalTx > 0) finalTx -= halfWidth;
    }

    track.style.transform = 'translate3d(' + finalTx.toFixed(2) + 'px,0,0)';
  }

  /* ============================================================
     FEATURED CARD (desktop only)
     ============================================================ */
  function updateFeatured() {
    if (cards.length === 0) return;
    var firstRect = cards[0].getBoundingClientRect();
    var viewportRect = viewport.getBoundingClientRect();
    var cardW = firstRect.width;
    var gap = parseFloat(getComputedStyle(track).columnGap) ||
              parseFloat(getComputedStyle(track).gap) || 0;
    var stride = cardW + gap;
    var vCenter = viewportRect.left + viewportRect.width / 2;

    var closest = -1, closestDist = Infinity;
    for (var i = 0; i < cards.length; i++) {
      var center = firstRect.left + i * stride + cardW / 2;
      var d = Math.abs(center - vCenter);
      if (d < closestDist) { closestDist = d; closest = i; }
    }

    var roomIdx = closest % ROOMS.length;
    if (roomIdx === featuredIdx) return;
    featuredIdx = roomIdx;

    cards.forEach(function (c, i) {
      c.classList.toggle('is-featured', i === closest);
    });

    if (activeNum) {
      activeNum.textContent = String(roomIdx + 1).padStart(2, '0');
    }
  }

  /* ============================================================
     TICK (desktop auto-scroll)
     ============================================================ */
  function tick(ts) {
    if (!lastFrame) lastFrame = ts;
    var dt = (ts - lastFrame) / 1000;
    lastFrame = ts;
    if (dt > 0.1) dt = 0.1;  // safety after tab switch

    if (!paused && !dragging) {
      baseTx -= speed * dt;
    }

    applyTransform();
    updateFeatured();

    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (rafId || isMobile || reducedMotion) return;
    measure();
    applyTransform();
    lastFrame = 0;
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    track.style.transform = '';
  }

  /* ============================================================
     DESKTOP DRAG
     ============================================================ */
  function bindDrag() {
    if (isMobile) return;

    viewport.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      dragging = true;
      dragStartX = e.clientX;
      dragStartTx = baseTx;
      viewport.classList.add('is-dragging');
      clearTimeout(resumeTimer);
      try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
    });

    viewport.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      baseTx = dragStartTx + (e.clientX - dragStartX);
      applyTransform();
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      viewport.classList.remove('is-dragging');
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(function () { paused = false; }, 2200);
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    viewport.addEventListener('pointerleave', function (e) {
      if (dragging && e.pointerType === 'mouse') endDrag();
    });
  }

  /* ============================================================
     HOVER PAUSE
     ============================================================ */
  function bindHoverPause() {
    if (isMobile) return;

    cards.forEach(function (card) {
      card.addEventListener('mouseenter', function () { paused = true; });
      card.addEventListener('mouseleave', function () { paused = false; });
      var link = card.querySelector('.c9-room-link');
      if (link) {
        link.addEventListener('focus', function () { paused = true; });
        link.addEventListener('blur',  function () { paused = false; });
      }
    });
  }

  /* ============================================================
     VISIBILITY — pause auto-scroll when section is off-screen
     ============================================================ */
  var inView = true;
  if ('IntersectionObserver' in window) {
    var visObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        inView = e.isIntersecting;
        if (isMobile) return;
        if (inView) start();
        else stop();
      });
    }, { threshold: 0 });
    visObs.observe(section);
  }

  /* ============================================================
     SCROLL REVEAL
     ============================================================ */
  if ('IntersectionObserver' in window) {
    var revealObs = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        section.classList.add('is-inview');
        obs.disconnect();
      });
    }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
    revealObs.observe(section);
  } else {
    section.classList.add('is-inview');
  }

  /* ============================================================
     INIT / MODE SWITCH
     ============================================================ */
  function setup() {
    isMobile = mobileMQ.matches;

    // Reset
    stop();
    baseTx = 0;
    paused = false;
    dragging = false;
    featuredIdx = -1;
    cards.forEach(function (c) { c.classList.remove('is-featured'); });

    // Render appropriate set
    render();

    if (isMobile) {
      // Native scroll — reset position, no transform
      viewport.scrollLeft = 0;
      if (activeNum) activeNum.textContent = '01';
    } else {
      bindDrag();
      bindHoverPause();
      start();
    }
  }

  /* Rebuild only when the breakpoint actually flips */
  var lastIsMobile = isMobile;
  function onResize() {
    var nowMobile = mobileMQ.matches;
    if (nowMobile !== lastIsMobile) {
      lastIsMobile = nowMobile;
      setup();
    } else if (!nowMobile) {
      // Same mode — just re-measure (card widths may have changed)
      clearTimeout(onResize._t);
      onResize._t = setTimeout(function () {
        measure();
        applyTransform();
      }, 150);
    }
  }

  if (mobileMQ.addEventListener) mobileMQ.addEventListener('change', onResize);
  else if (mobileMQ.addListener) mobileMQ.addListener(onResize);
  window.addEventListener('resize', onResize, { passive: true });

  /* Kick off */
  setup();

})();
</script>
